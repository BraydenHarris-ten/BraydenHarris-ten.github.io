<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brayden Harris - Resume</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        header {
            text-align: center;
        }
        img.profile {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }
        .social-icons img {
            width: 32px;
            height: 32px;
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <header>
        <!-- Task 3: img tag (Profile Picture) -->
        <img src="https://via.placeholder.com/150" alt="Profile Picture" class="profile">
        
        <!-- Task 4: H1 tag -->
        <h1>Welcome to My Resume</h1>
        
        <!-- Task 2: span tag with Student's Name -->
        <p>Name: <span id="student-name">Brayden Harris</span></p>
    </header>

    <section>
        <h2>About Me</h2>
        <p>Motivated and dedicated student at UCR pursuing a degree in Computer Science.</p>
    </section>

    <section>
        <h2>Contact & Socials</h2>
        <div class="social-icons">
            <!-- Task 5: LinkedIn Social Icon -->
            <a href="https://linkedin.com" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn">
            </a>
            
            <!-- Task 6: GitHub Social Icon -->
            <a href="https://github.com/braydenharris-ten" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub">
            </a>
            
            <!-- Task 7: Twitter Social Icon -->
            <a href="https://twitter.com" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter">
            </a>
            
            <!-- Task 8: Email Social Icon -->
            <a href="mailto:bharr056@ucr.edu">
                <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Email">
            </a>
        </div>
    </section>

</body>
</html>
